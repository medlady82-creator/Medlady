<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>核心技术页 SVG 方案预览</title>
    <style>
      :root {
        --navy: #0b1f3a;
        --blue: #1e8cff;
        --cyan: #7ee7ff;
        --green: #2ecf8f;
        --line: #dce7f2;
        --muted: #637083;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--navy);
        background: linear-gradient(180deg, #f7fbff, #eef7fd);
        font-family:
          Inter, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", Arial,
          sans-serif;
      }

      header {
        padding: 48px 6vw 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 4vw, 56px);
        line-height: 1.1;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        padding: 24px 6vw 72px;
      }

      article {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 50px rgba(11, 31, 58, 0.06);
      }

      article svg {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #f7fbff;
      }

      .caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px 20px;
      }

      .caption strong {
        font-size: 20px;
      }

      .caption span {
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
