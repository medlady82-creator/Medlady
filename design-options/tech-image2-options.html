<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>核心技术页 Image2 封面方案</title>
    <style>
      :root {
        --navy: #0b1f3a;
        --blue: #1e8cff;
        --muted: #637083;
        --line: #dce7f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--navy);
        background: linear-gradient(180deg, #f7fbff, #eef7fd);
        font-family:
          Inter, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", Arial,
          sans-serif;
      }

      header {
        padding: 48px 6vw 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 4vw, 56px);
        line-height: 1.1;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        padding: 24px 6vw 72px;
      }

      article {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 50px rgba(11, 31, 58, 0.06);
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
      }

      .caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px 20px;
      }

      strong {
        font-size: 22px;
      }

      span {
        color: var(--blue);
        font-weight: 800;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>核心技术页 Image2 封面方案</h1>
      <p>这次是真正用 Image2 生成的 10 张图。选好编号后，我再替换正式核心技术页。</p>
    </header>
    <main>
      <article>
        <img src="./tech-image2-preview/tech-image2-01.jpg" alt="Image2 方案 01" />
        <div class="caption"><strong>方案 01</strong><span>柔性足底压力云图</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-02.jpg" alt="Image2 方案 02" />
        <div class="caption"><strong>方案 02</strong><span>下肢运动数字孪生</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-03.jpg" alt="Image2 方案 03" />
        <div class="caption"><strong>方案 03</strong><span>训练鞋与压力鞋垫</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-04.jpg" alt="Image2 方案 04" />
        <div class="caption"><strong>方案 04</strong><span>足踝靴柔性传感</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-05.jpg" alt="Image2 方案 05" />
        <div class="caption"><strong>方案 05</strong><span>压力平台与数据反馈</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-06.jpg" alt="Image2 方案 06" />
        <div class="caption"><strong>方案 06</strong><span>产品矩阵与数据流</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-07.jpg" alt="Image2 方案 07" />
        <div class="caption"><strong>方案 07</strong><span>智能鞋垫分层结构</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-08.jpg" alt="Image2 方案 08" />
        <div class="caption"><strong>方案 08</strong><span>下肢步态数据映射</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-09.jpg" alt="Image2 方案 09" />
        <div class="caption"><strong>方案 09</strong><span>柔性传感材料带</span></div>
      </article>
      <article>
        <img src="./tech-image2-preview/tech-image2-10.jpg" alt="Image2 方案 10" />
        <div class="caption"><strong>方案 10</strong><span>传感材料微观特写</span></div>
      </article>
    </main>
  </body>
</html>
